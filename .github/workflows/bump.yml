name: Bump WenSolata Mono

on:
  schedule:
    # ponytail: GitHub disables schedules after 60 days without repo activity;
    # trigger this workflow from the font release job if releases get missed.
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update the cask to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R hanlhe/WenSolata-Mono --json tagName --jq .tagName)
          version=${tag#v}
          [[ $version =~ ^[0-9]+(\.[0-9]+)+$ ]]
          cask=Casks/font-wensolata-mono.rb
          grep -q "version \"$version\"" "$cask" && exit 0
          curl -fsSLo package.zip "https://github.com/hanlhe/WenSolata-Mono/releases/download/$tag/WenSolataMono-$tag.zip"
          unzip -l package.zip 'dist/WenSolataMono-*.ttf'
          sha256=$(sha256sum package.zip | cut -d' ' -f1)
          sed -i -e "s/^  version .*/  version \"$version\"/" \
            -e "s/^  sha256 .*/  sha256 \"$sha256\"/" "$cask"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Update WenSolata Mono to $version"
          git push
